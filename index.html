<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>백세일자리 — 전국 시니어 일자리 한눈에</title>
<meta name="description" content="전국 시니어(노인) 일자리 공고를 한 곳에. 노인공익활동·사회서비스형·시장형·취업알선형 모집 정보를 모았어요.">
<style>
:root{
  --primary:#1f7a4d; --primary-dark:#14603c; --bg:#fafbf7; --card:#ffffff;
  --text:#1c1f1a; --muted:#5b625b; --line:#dfe6dd; --tag-bg:#e8f4ec;
  --urgent:#d92d20; --radius:16px;
}
/* 시니어 친화: 기본 글자 18px, 고대비 */
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:18px}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text);line-height:1.65}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;min-height:48px}
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.97);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.header-inner{max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:1.45rem;font-weight:800;color:var(--primary);letter-spacing:-.5px}
.logo small{font-size:.78rem;color:var(--muted);font-weight:500;margin-left:6px}
.hero{max-width:1080px;margin:0 auto;padding:40px 20px 8px;text-align:center}
.hero h1{font-size:1.9rem;font-weight:800;letter-spacing:-1px;margin-bottom:8px}
.hero h1 span{color:var(--primary)}
.hero p{color:var(--muted);font-size:1rem;margin-bottom:22px}
.search-wrap{max-width:560px;margin:0 auto;display:flex;gap:8px}
.search-wrap input{flex:1;padding:14px 20px;border:2px solid var(--line);border-radius:999px;font-size:1rem;outline:none;background:#fff;min-height:54px}
.search-wrap input:focus{border-color:var(--primary)}
.search-wrap button{background:var(--primary);color:#fff;border:none;border-radius:999px;padding:0 30px;font-size:1.05rem;font-weight:700}
.search-wrap button:hover{background:var(--primary-dark)}
.quick-chips{margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;padding:10px 18px;border-radius:999px;font-size:.95rem;color:var(--muted);min-height:44px}
.chip:hover,.chip.on{border-color:var(--primary);color:var(--primary);font-weight:700}
.filter-bar{max-width:1080px;margin:26px auto 0;padding:0 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filter-bar select{padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:1rem;background:#fff;color:var(--text);min-height:52px;max-width:200px}
.result-count{margin-left:auto;font-size:.95rem;color:var(--muted);font-weight:600}
.job-grid{max-width:1080px;margin:18px auto 0;padding:0 20px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.job-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;gap:12px;transition:transform .15s,box-shadow .15s}
.job-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(31,122,77,.12)}
.job-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.job-org{font-size:.9rem;color:var(--muted)}
.job-title{font-size:1.15rem;font-weight:700;letter-spacing:-.3px;line-height:1.5}
.bookmark{background:none;border:none;font-size:1.5rem;line-height:1;color:#c8cdd6;padding:6px}
.bookmark.on{color:var(--primary)}
.job-meta{display:flex;flex-wrap:wrap;gap:8px}
.badge{font-size:.85rem;font-weight:700;padding:6px 14px;border-radius:999px;background:var(--tag-bg);color:var(--primary-dark)}
.badge.t-공익{background:#e8f4ec;color:#14603c}
.badge.t-사회{background:#e7f0fb;color:#1a4f8a}
.badge.t-시장{background:#fdf3e3;color:#9a5b00}
.badge.t-취업{background:#f3e8fb;color:#6b2fa0}
.badge.t-기타{background:#eef0ee;color:#4c534c}
.job-salary{font-size:1.05rem;font-weight:800;color:var(--text)}
.job-sub{font-size:.95rem;color:var(--muted)}
.job-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px dashed var(--line);gap:8px}
.deadline{font-size:.95rem;color:var(--muted);font-weight:600}
.deadline.urgent{color:var(--urgent);font-weight:800;font-size:1.05rem}
.detail-btn{background:#fff;border:2px solid var(--primary);color:var(--primary);padding:10px 22px;border-radius:999px;font-size:1rem;font-weight:700}
.detail-btn:hover{background:var(--primary);color:#fff}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted);font-size:1.05rem}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-back.open{display:flex}
.modal{background:#fff;border-radius:20px;max-width:600px;width:100%;max-height:88vh;overflow-y:auto;padding:30px;position:relative}
.modal-close{position:absolute;top:16px;right:16px;background:#eef2f0;border:none;width:44px;height:44px;border-radius:50%;font-size:1.1rem;color:var(--muted);min-height:44px}
.modal h2{font-size:1.35rem;letter-spacing:-.5px;margin:8px 0 4px;padding-right:44px;line-height:1.5}
.modal .job-org{font-size:1rem}
.modal-sec{margin-top:20px}
.modal-sec h3{font-size:1rem;color:var(--primary-dark);margin-bottom:8px}
.modal-sec p,.modal-sec li{font-size:1.02rem}
.modal-sec ul{padding-left:20px}
.apply-btn{width:100%;margin-top:24px;background:var(--primary);color:#fff;border:none;border-radius:14px;padding:16px;font-size:1.15rem;font-weight:800}
.apply-btn:hover{background:var(--primary-dark)}
a.apply-btn{display:block;text-align:center}
.phone-btn{display:inline-block;margin-top:8px;background:#fff;border:2px solid var(--primary);color:var(--primary);border-radius:12px;padding:12px 24px;font-size:1.1rem;font-weight:800}
footer{border-top:1px solid var(--line);background:#fff;padding:30px 20px;text-align:center;color:var(--muted);font-size:.9rem;line-height:1.9}
footer strong{color:var(--text);font-size:1rem}
@media(max-width:600px){
  html{font-size:17px}
  .hero h1{font-size:1.6rem}
  .filter-bar select{max-width:none;flex:1 1 45%}
  .search-wrap button{padding:0 20px}
}
</style>

</head>
<body>
<header>
  <div class="header-inner">
    <a href="#" class="logo" onclick="return false;">백세일자리<small>전국 시니어 일자리 한눈에</small></a>
  </div>
</header>

<section class="hero">
  <h1>전국 시니어 일자리, <span>한 곳에</span></h1>
  <p>노인일자리·시니어 채용 공고를 모았어요. 큰 글씨로 편하게 보세요.</p>
  <div class="search-wrap">
    <input type="text" id="search-input" placeholder="일자리 이름 또는 지역으로 검색 (예: 수원 노노케어)">
    <button onclick="applyFilters()">검색</button>
  </div>
  <div class="quick-chips" id="quick-chips"></div>
</section>

<div class="filter-bar">
  <select id="filter-sido" onchange="applyFilters()">
    <option value="">지역 전체</option>
  </select>
  <select id="filter-type" onchange="applyFilters()">
    <option value="">사업유형 전체</option>
    <option>노인공익활동사업</option>
    <option>사회서비스형</option>
    <option>시장형(공동체사업단)</option>
    <option>취업알선형</option>
    <option>기타</option>
  </select>
  <select id="filter-sort" onchange="applyFilters()">
    <option value="deadline">마감임박순</option>
    <option value="new">최신순</option>
  </select>
  <span class="result-count" id="result-count"></span>
</div>

<main class="job-grid" id="job-grid"></main>

<div class="modal-back" id="modal-back" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<footer>
  <strong>백세일자리</strong> — 전국 시니어 일자리 통합 사이트<br>
  공고는 각 기관 공식 게시판의 공개 정보를 수집한 것으로, 지원 전 원문을 확인하세요.<br>
  <span id="visit-wrap">누적 방문자 <b id="visit-count" style="color:var(--primary)">–</b>명 · 오늘 <b id="visit-daily" style="color:var(--primary)">–</b>명</span>
</footer>

<script>
/* ---------- 방문자 카운터 (실패 시 영역 숨김) ---------- */
(function(){
  var today = new Date().toLocaleDateString('en-CA', {timeZone:'Asia/Seoul'});
  var dailyKey = 'visits-' + today;
  fetch('https://abacus.jasoncameron.dev/hit/baekse-jobs-site/visits')
    .then(r=>r.json())
    .then(d=>{
      document.getElementById('visit-count').textContent = Number(d.value).toLocaleString();
    })
    .catch(()=>{ document.getElementById('visit-wrap').style.display='none'; });
  fetch('https://abacus.jasoncameron.dev/hit/baekse-jobs-site/'+dailyKey)
    .then(r=>r.json())
    .then(d=>{
      document.getElementById('visit-daily').textContent = Number(d.value).toLocaleString();
    })
    .catch(()=>{});
})();
</script>
<script>
/* ================= TEMP 샘플 데이터 (jobs.json 연결 전까지 화면 검증용) =================
   실데이터 스키마: {id, title, org, region_sido, region_sigungu, type, start_date,
                     end_date(""=없음), salary, phone, url, source} */
const TEMP_JOBS = [
  {id:"temp-gg-01", title:"노노케어 참여자 모집 (독거노인 안부확인)", org:"수원시니어클럽",

   start_date:"2026-10-01", end_date:"2026-10-20", salary:"월 27만원 (활동비)",
   phone:"031-000-0001", url:"https://www.seniorcafe.go.kr", source:"노인일자리여기"},
  {id:"temp-gg-02", title:"보육시설 급식도우미 모집", org:"성남시니어클럽",
   region_sido:"경기도", region_sigungu:"성남시", type:"사회서비스형",
   start_date:"2026-10-05", end_date:"2026-10-24", salary:"월 54만원",
   phone:"031-000-0002", url:"https://www.seniorcafe.go.kr", source:"노인일자리여기"},
  {id:"temp-gg-03", title:"시니어 인턴십 참여기업 매칭 (사무보조)", org:"용인시니어일자리센터",
   region_sido:"경기도", region_sigungu:"용인시", type:"취업알선형",
   start_date:"2026-10-08", end_date:"2026-10-29", salary:"시급 10,030원",
   phone:"031-000-0003", url:"https://www.work.go.kr", source:"워크넷"},
  {id:"temp-se-01", title:"공공시설 환경정비 활동 참여자 모집", org:"송파시니어클럽",
   region_sido:"서울특별시", region_sigungu:"송파구", type:"노인공익활동사업",
   start_date:"2026-10-10", end_date:"2026-11-06", salary:"월 27만원 (활동비)",
   phone:"02-000-0001", url:"https://www.seniorcafe.go.kr", source:"노인일자리여기"},
  {id:"temp-se-02", title:"할매손 칼국수 사업단 참여자 모집", org:"노원시니어클럽",
   region_sido:"서울특별시", region_sigungu:"노원구", type:"시장형(공동체사업단)",
   start_date:"2026-10-12", end_date:"2026-11-11", salary:"수익 배분 (월 30~50만원)",
   phone:"02-000-0002", url:"https://50plus.or.kr", source:"서울시 50플러스포털"},
  {id:"temp-bs-01", title:"스쿨존 교통안전 지원 활동가 모집", org:"해운대시니어클럽",
   region_sido:"부산광역시", region_sigungu:"해운대구", type:"사회서비스형",
   start_date:"2026-10-14", end_date:"2026-11-16", salary:"월 54만원",
   phone:"051-000-0001", url:"https://www.seniorcafe.go.kr", source:"노인일자리여기"}
];
</script>
<script>
/* ================= 데이터 로드: jobs.json → 실패 시 TEMP 샘플 폴백 ================= */
let JOBS = [];
let bookmarks = JSON.parse(localStorage.getItem('baeksejobs_bookmarks')||'[]');

const TYPE_CLASS = {
  '노인공익활동사업':'t-공익', '사회서비스형':'t-사회',
  '시장형(공동체사업단)':'t-시장', '취업알선형':'t-취업', '기타':'t-기타'
};
const QUICK_REGIONS = ['서울','경기','인천','부산','대구','광주','대전','강원','충청','전라','경상','제주'];

function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function daysLeft(endDate){
  if(!endDate) return NaN;
  const t = new Date(endDate+'T23:59:59');
  return Math.ceil((t - new Date())/86400000);
}
function deadlineText(j){
  const d = daysLeft(j.end_date);
  if(isNaN(d)) return {txt:'마감일 원문 확인', urgent:false};
  if(d<0)  return {txt:'마감됨', urgent:false};
  if(d===0) return {txt:'오늘 마감', urgent:true};
  return {txt:'D-'+d, urgent:d<=7};
}
function regionLabel(j){
  return (j.region_sido||'') + (j.region_sigungu ? ' '+j.region_sigungu : '');
}

function buildChips(){
  document.getElementById('quick-chips').innerHTML =
    QUICK_REGIONS.map(r=>`<button class="chip" data-r="${r}" onclick="quickSearch('${r}')">${r}</button>`).join('');
}
function buildSidoFilter(){
  const sidos = [...new Set(JOBS.map(j=>j.region_sido).filter(Boolean))].sort();
  const sel = document.getElementById('filter-sido');
  sel.innerHTML = '<option value="">지역 전체</option>' +
    sidos.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');
}

function allJobs(){ return JOBS; }
function getJob(id){ return JOBS.find(j=>String(j.id)===String(id)); }

function applyFilters(){
  const q = document.getElementById('search-input').value.trim();
  const sido = document.getElementById('filter-sido').value;
  const type = document.getElementById('filter-type').value;
  const sort = document.getElementById('filter-sort').value;
  let jobs = JOBS.filter(j=>{
    if(sido && j.region_sido!==sido) return false;
    if(type && j.type!==type) return false;
    if(q){
      const hay = (j.title+' '+j.org+' '+regionLabel(j)+' '+j.type).toLowerCase();
      if(!q.toLowerCase().split(/\s+/).every(w=>hay.includes(w))) return false;
    }
    return true;
  });
  jobs.sort((a,b)=>{
    if(sort==='deadline'){
      const da = a.end_date||'9999', db = b.end_date||'9999';
      return da.localeCompare(db);
    }
    return String(b.start_date||'').localeCompare(String(a.start_date||''))
        || String(b.id).localeCompare(String(a.id));
  });
  renderJobs(jobs);
}

function renderJobs(jobs){
  const grid = document.getElementById('job-grid');
  document.getElementById('result-count').textContent = '총 '+jobs.length+'건';
  if(!jobs.length){
    grid.innerHTML = '<div class="empty">조건에 맞는 공고가 없어요.<br>검색어나 지역을 바꿔보세요.</div>';
    return;
  }
  grid.innerHTML = jobs.map(j=>{
    const bm = bookmarks.includes(String(j.id)) ? 'on' : '';
    const dl = deadlineText(j);
    const typeCls = TYPE_CLASS[j.type] || 't-기타';
    const endTxt = j.end_date ? ' · ~ '+esc(j.end_date) : '';
    return `<div class="job-card">
      <div class="job-top">
        <div><div class="job-org">${esc(j.org)}</div>
        <div class="job-title">${esc(j.title)}</div></div>
        <button class="bookmark ${bm}" onclick="toggleBookmark('${esc(String(j.id))}',this)" title="찜하기" aria-label="찜하기">♥</button>
      </div>
      <div class="job-meta">
        <span class="badge ${typeCls}">${esc(j.type||'기타')}</span>
        <span class="badge">${esc(regionLabel(j))}</span>
      </div>
      ${j.salary?`<div class="job-salary">${esc(j.salary)}</div>`:''}
      <div class="job-sub">${esc(j.source||'')}</div>
      <div class="job-foot">
        <span class="deadline${dl.urgent?' urgent':''}">${dl.txt}${endTxt}</span>
        <button class="detail-btn" onclick="openModal('${esc(String(j.id))}')">상세보기</button>
      </div>
    </div>`;
  }).join('');
}

function quickSearch(q){
  document.getElementById('search-input').value = q;
  document.querySelectorAll('#quick-chips .chip').forEach(c=>c.classList.toggle('on', c.dataset.r===q));
  applyFilters();
  document.getElementById('job-grid').scrollIntoView({behavior:'smooth'});
}
document.getElementById('search-input').addEventListener('keydown', e=>{
  if(e.key==='Enter') applyFilters();
});

function toggleBookmark(id, btn){
  id = String(id);
  const i = bookmarks.indexOf(id);
  if(i>=0){ bookmarks.splice(i,1); btn.classList.remove('on'); }
  else{ bookmarks.push(id); btn.classList.add('on'); }
  localStorage.setItem('baeksejobs_bookmarks', JSON.stringify(bookmarks));
}

function openModal(id){
  const j = getJob(id);
  if(!j) return;
  const dl = deadlineText(j);
  const typeCls = TYPE_CLASS[j.type] || 't-기타';
  const phoneRow = j.phone
    ? `<div class="modal-sec"><h3>문의 전화</h3><p><strong style="font-size:1.25rem">${esc(j.phone)}</strong><br><a class="phone-btn" href="tel:${esc(j.phone.replace(/[^0-9+]/g,''))}">📞 전화 걸기</a></p></div>` : '';
  const srcRow = (j.url)
    ? `<div class="modal-sec"><h3>원문 공고</h3><p><a href="${esc(j.url)}" target="_blank" rel="noopener" style="color:var(--primary);font-weight:700">원문 보러 가기 →</a></p></div>` : '';
  const applyBtn = j.url
    ? `<a class="apply-btn" href="${esc(j.url)}" target="_blank" rel="noopener">원문 보러 가기</a>` : '';
  document.getElementById('modal-body').innerHTML = `
    <div class="job-org">${esc(j.org)}${j.source?' · '+esc(j.source):''}</div>
    <h2>${esc(j.title)}</h2>
    <div class="job-meta" style="margin-top:10px">
      <span class="badge ${typeCls}">${esc(j.type||'기타')}</span>
      <span class="badge">${esc(regionLabel(j))}</span>
      <span class="badge ${dl.urgent?'':''}" ${dl.urgent?'style="background:#fdecea;color:#d92d20"':''}>${dl.txt}</span>
    </div>
    ${j.salary?`<div class="modal-sec"><h3>급여·활동비</h3><p><strong>${esc(j.salary)}</strong></p></div>`:''}
    <div class="modal-sec"><h3>모집 기간</h3><p>${esc(j.start_date||'')} ~ ${esc(j.end_date||'원문 확인')}</p></div>
    ${phoneRow}
    ${srcRow}
    ${applyBtn}`;
  document.getElementById('modal-back').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  document.getElementById('modal-back').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

/* ---------- 초기화 ---------- */
buildChips();
fetch('jobs.json')
  .then(r=>{ if(!r.ok) throw new Error('no jobs.json'); return r.json(); })
  .then(d=>{
    const arr = Array.isArray(d) ? d : (d.jobs||[]);
    JOBS = arr.length ? arr : TEMP_JOBS;
    if(!arr.length) console.info('[백세일자리] jobs.json 없음/빈값 → TEMP 샘플 표시');
  })
  .catch(()=>{ JOBS = TEMP_JOBS; console.info('[백세일자리] jobs.json 로드 실패 → TEMP 샘플 표시'); })
  .finally(()=>{
    buildSidoFilter();
    applyFilters();
  });
</script>
</body>
</html>
